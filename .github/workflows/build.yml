name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dotnet:
    name: Build Extension
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test

  publish-local:
    name: Publish Locally
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6

      - name: Setup Bicep
        uses: anthony-c-martin/setup-bicep@v1
        with:
          version: 0.45.6
        
      - name: Publish Locally
        run: |
          bash scripts/publish.sh bicep-ext-github
